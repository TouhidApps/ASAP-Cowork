<svg width="1010" height="620" viewBox="0 0 1010 620" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="1010" height="620" fill="#ffffff"/>

  <!-- Title -->
  <text x="505" y="42" text-anchor="middle" font-size="22" font-weight="600" fill="#1a1f27">Remote Development Access via Tailscale Funnel</text>
  <text x="505" y="64" text-anchor="middle" font-size="13" fill="#5b6472">Client sends a request over an encrypted tunnel; development, build, and device testing all stay on the host machine</text>

  <!-- ================= CLIENT (left) ================= -->
  <text x="150" y="108" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1f27">Mobile Client</text>
  <text x="150" y="126" text-anchor="middle" font-size="11.5" fill="#5b6472">Web UI, any network</text>

  <rect x="60" y="150" width="180" height="300" rx="18" fill="#ffffff" stroke="#1a1f27" stroke-width="2"/>
  <rect x="76" y="176" width="148" height="238" rx="4" fill="#f2f4f7" stroke="#c7cdd6" stroke-width="1.5"/>
  <circle cx="150" cy="432" r="7" fill="none" stroke="#1a1f27" stroke-width="1.5"/>

  <!-- request bubble -->
  <rect x="88" y="190" width="124" height="42" rx="8" fill="#e7edfb" stroke="#3457c9" stroke-width="1.2"/>
  <text x="150" y="207" text-anchor="middle" font-size="10.5" fill="#1f3a8f">Request: build and</text>
  <text x="150" y="220" text-anchor="middle" font-size="10.5" fill="#1f3a8f">run the application</text>

  <!-- response bubble -->
  <rect x="96" y="244" width="108" height="42" rx="8" fill="#e6f4ea" stroke="#2f8f4e" stroke-width="1.2"/>
  <text x="150" y="261" text-anchor="middle" font-size="10.5" fill="#1e6b38">Response: build</text>
  <text x="150" y="274" text-anchor="middle" font-size="10.5" fill="#1e6b38">status and logs</text>

  <!-- status lines -->
  <g stroke="#c7cdd6" stroke-width="1.5">
    <line x1="90" y1="312" x2="210" y2="312"/>
    <line x1="90" y1="326" x2="190" y2="326"/>
    <line x1="90" y1="340" x2="200" y2="340"/>
  </g>

  <!-- ================= TUNNEL (middle) ================= -->
  <g stroke="#1a1f27" stroke-width="1.75" fill="none">
    <line x1="240" y1="240" x2="360" y2="240" marker-end="url(#arrow)"/>
    <line x1="360" y1="300" x2="240" y2="300" marker-end="url(#arrow)"/>
  </g>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1f27"/>
    </marker>
  </defs>

  <rect x="340" y="205" width="240" height="130" rx="10" fill="#fbf8ee" stroke="#b8934a" stroke-width="1.5"/>
  <text x="460" y="230" text-anchor="middle" font-size="13" font-weight="600" fill="#5c4614">Tailscale Funnel</text>
  <text x="460" y="248" text-anchor="middle" font-size="11" fill="#5c4614">Encrypted HTTPS tunnel</text>
  <text x="460" y="264" text-anchor="middle" font-size="11" fill="#5c4614">over the private tailnet</text>

  <line x1="380" y1="280" x2="540" y2="280" stroke="#d9c78e" stroke-width="1"/>
  <text x="460" y="300" text-anchor="middle" font-size="10.5" fill="#7a6224">No public port exposure —</text>
  <text x="460" y="315" text-anchor="middle" font-size="10.5" fill="#7a6224">authenticated tailnet identity</text>

  <g stroke="#1a1f27" stroke-width="1.75" fill="none">
    <line x1="580" y1="240" x2="672" y2="240" marker-end="url(#arrow)"/>
    <line x1="672" y1="300" x2="580" y2="300" marker-end="url(#arrow)"/>
  </g>

  <!-- ================= HOST (right) — laptop illustration ================= -->
  <text x="785" y="90" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1f27">Personal Laptop</text>
  <text x="785" y="108" text-anchor="middle" font-size="11.5" fill="#5b6472">Any machine you develop on</text>

  <!-- screen -->
  <rect x="700" y="128" width="170" height="118" rx="8" fill="#1a1f27"/>
  <rect x="710" y="138" width="150" height="98" rx="3" fill="#0d1117"/>

  <!-- terminal content on screen -->
  <text x="718" y="156" font-size="9.5" fill="#8ee08e" font-family="'SF Mono',Consolas,monospace">$ ./gradlew build</text>
  <text x="718" y="171" font-size="9.5" fill="#9fb4ff" font-family="'SF Mono',Consolas,monospace">chat-gateway:  ready</text>
  <text x="718" y="186" font-size="9.5" fill="#9fb4ff" font-family="'SF Mono',Consolas,monospace">build-runner:  ready</text>
  <text x="718" y="201" font-size="9.5" fill="#f5d76e" font-family="'SF Mono',Consolas,monospace">editing: LoginScreen.kt</text>
  <text x="718" y="216" font-size="9.5" fill="#8ee08e" font-family="'SF Mono',Consolas,monospace">BUILD SUCCESSFUL</text>

  <!-- hinge -->
  <rect x="697" y="246" width="176" height="6" rx="2" fill="#3a4150"/>

  <!-- keyboard base (trapezoid) -->
  <path d="M676 252 L894 252 L910 288 L660 288 Z" fill="#e8eaee" stroke="#1a1f27" stroke-width="2"/>
  <rect x="700" y="262" width="170" height="4" rx="2" fill="#c7cdd6"/>
  <path d="M770 288 L800 288 L796 294 L774 294 Z" fill="#c7cdd6"/>

  <!-- labels below laptop -->
  <text x="785" y="326" text-anchor="middle" font-size="11" font-weight="600" fill="#1a1f27">Services</text>
  <text x="785" y="342" text-anchor="middle" font-size="10.5" fill="#5b6472">chat-gateway · build-runner</text>

  <line x1="717" y1="356" x2="853" y2="356" stroke="#d5d9e0" stroke-width="1"/>

  <text x="785" y="376" text-anchor="middle" font-size="11" font-weight="600" fill="#1a1f27">Development &amp; Build</text>
  <text x="785" y="394" text-anchor="middle" font-size="10.5" fill="#5b6472">Editing, Gradle, ADB, Emulator</text>
  <text x="785" y="410" text-anchor="middle" font-size="10.5" fill="#5b6472">runs locally, no cloud step</text>

  <rect x="717" y="424" width="136" height="30" rx="6" fill="#ffffff" stroke="#c7cdd6" stroke-width="1.2"/>
  <text x="785" y="443" text-anchor="middle" font-size="10.5" fill="#1a1f27">Code and data stay on-device</text>

  <!-- ================= TEST DEVICE (attached to laptop) ================= -->
  <text x="960" y="90" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1f27">Test Device</text>
  <text x="960" y="108" text-anchor="middle" font-size="11.5" fill="#5b6472">physical phone or emulator</text>

  <!-- cable from laptop to device -->
  <path d="M873 180 C 900 180, 905 185, 928 188" stroke="#1a1f27" stroke-width="1.75" fill="none" marker-end="url(#arrow)"/>
  <text x="900" y="170" text-anchor="middle" font-size="9.5" fill="#5b6472">USB / ADB</text>

  <!-- device body -->
  <rect x="928" y="188" width="62" height="128" rx="12" fill="#ffffff" stroke="#1a1f27" stroke-width="2"/>
  <rect x="936" y="200" width="46" height="94" rx="3" fill="#0d1117"/>
  <circle cx="959" cy="308" r="4" fill="none" stroke="#1a1f27" stroke-width="1.3"/>

  <!-- screen preview + record indicator -->
  <rect x="941" y="205" width="36" height="24" rx="2" fill="#232a35"/>
  <circle cx="947" cy="238" r="3.2" fill="#d64545"/>
  <text x="954" y="241" font-size="8" fill="#e6e9ee" font-family="'SF Mono',Consolas,monospace">REC</text>
  <text x="959" y="256" text-anchor="middle" font-size="8" fill="#8ee08e" font-family="'SF Mono',Consolas,monospace">screenshot</text>
  <text x="959" y="268" text-anchor="middle" font-size="8" fill="#8ee08e" font-family="'SF Mono',Consolas,monospace">captured</text>

  <text x="959" y="336" text-anchor="middle" font-size="10.5" fill="#5b6472">for screenshots &amp;</text>
  <text x="959" y="351" text-anchor="middle" font-size="10.5" fill="#5b6472">screen recording</text>

  <!-- caption -->
  <line x1="60" y1="472" x2="950" y2="472" stroke="#e3e6ea" stroke-width="1"/>
  <text x="505" y="494" text-anchor="middle" font-size="12.5" fill="#1a1f27">Requests issued from any device reach the host machine through Tailscale Funnel; development, the build, the emulator or a connected</text>
  <text x="505" y="512" text-anchor="middle" font-size="12.5" fill="#1a1f27">test device, and captured logs, screenshots, and recordings all remain local to the host.</text>
  <text x="505" y="530" text-anchor="middle" font-size="11" fill="#8a92a0">Enabled via: ./asap.sh — Option 2 (Run All with Tailscale Funnel)</text>

  <!-- ================= TIPS ================= -->
  <rect x="60" y="548" width="890" height="56" rx="8" fill="#fff8e6" stroke="#e8c766" stroke-width="1.2"/>
  <text x="80" y="568" font-size="11.5" font-weight="600" fill="#7a5c00">Tip:</text>
  <text x="112" y="568" font-size="11.5" fill="#5b4a10">keep the laptop's sleep / screen-lock mode off while running builds and Tailscale Funnel — sleep interrupts an in-progress build or breaks the tunnel.</text>
  <text x="80" y="590" font-size="11.5" font-weight="600" fill="#7a5c00">Tip:</text>
  <text x="112" y="590" font-size="11.5" fill="#5b4a10">keep the test device's sleep / auto-lock off (or enable "Stay awake while charging" in Developer Options) so recordings and app sessions aren't cut short.</text>
</svg>
